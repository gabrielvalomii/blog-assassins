<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Blog Assassins Cred</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-page">
    <div class="container">
        <div class="left-panel">
            <div class="left-content">
                <div class="logo">
                    <i class="fas fa-book-open"></i>
                </div>
                <h1 class="blog-title">Blog Assassins Cred</h1>
                <p class="blog-subtitle">Conecte-se com a comunidade e compartilhe conhecimento</p>
                <div class="features">
                    <div class="feature">
                        <i class="fas fa-users"></i>
                        <span>Comunidade Ativa</span>
                    </div>
                    <div class="feature">
                        <i class="fas fa-share-alt"></i>
                        <span>Compartilhe Ideias</span>
                    </div>
                    <div class="feature">
                        <i class="fas fa-star"></i>
                        <span>Destaque Conteúdo</span>
                    </div>
                </div>
                <p class="dev-sign">💻 Desenvolvido por Gabriel Valomi</p>
            </div>
        </div>
        <div class="right-panel">
            <form class="login-form" id="loginForm">
                <div class="form-header">
                    <h2>Bem-vindo de volta!</h2>
                    <p>Faça login em sua conta</p>
                </div>

                <div class="form-group">
                    <label for="email">
                        <i class="fas fa-envelope"></i> Email
                    </label>
                    <input type="email" id="email" name="email" placeholder="seu@email.com" required>
                </div>

                <div class="form-group">
                    <label for="senha">
                        <i class="fas fa-lock"></i> Senha
                    </label>
                    <div class="password-input">
                        <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
                        <button type="button" class="toggle-password" id="togglePassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-checkbox">
                    <input type="checkbox" id="lembrar" name="lembrar">
                    <label for="lembrar">Lembrar-me</label>
                </div>

                <button type="submit" class="btn-login">
                    <span>Entrar</span>
                    <i class="fas fa-arrow-right"></i>
                </button>

                <div class="divider">
                    <span>ou</span>
                </div>

                <button type="button" class="btn-social" id="googleLogin">
                    <i class="fab fa-google"></i> Entrar com Google
                </button>

                <div class="login-links">
                    <a href="#" class="link" id="forgotPassword">
                        <i class="fas fa-key"></i> Redefinir senha
                    </a>
                    <span class="link-sep">•</span>
                    <a href="../cadastro/index.html" class="link">
                        <i class="fas fa-user-plus"></i> Criar conta
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
